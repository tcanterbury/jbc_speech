# Cloudflare Worker for the feedback form. Setup: docs/feedback-form.md
# Deployed by Cloudflare Workers Builds from this repo (root directory: worker) on every push to main,
# or by hand from this folder with: npx wrangler@4 deploy
# Secrets (dashboard > Settings > Variables and Secrets, or `npx wrangler@4 secret put <NAME>`):
#   GITHUB_TOKEN      fine-grained token: Issues read/write, jbc_speech only
#   TURNSTILE_SECRET  from the Turnstile widget
# The name must match the Worker created in the Cloudflare dashboard.
name = "jbc-speech-word-addin"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
REPO = "tcanterbury/jbc_speech"
# Pages that may send the form (comma-separated). The add-in's links all open the hosted form.
ALLOWED_ORIGINS = "https://tcanterbury.github.io"

[observability]
enabled = true
